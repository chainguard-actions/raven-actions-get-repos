---
name: Publish Release

on:
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag-name:
        description: Tag name that the major tag will point to
        required: true

permissions:
  contents: read

jobs:
  publish-release:
    name: Publish Release
    uses: raven-actions/.workflows/.github/workflows/__release-publish.yml@6da075fe5a370a05993c72f0a7b7dd109389e691 # main
    secrets: inherit
    with:
      tag-name: ${{ github.event.inputs.tag-name || github.event.release.tag_name }}
