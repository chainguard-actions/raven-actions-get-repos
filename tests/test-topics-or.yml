name: Test topics filter with OR operator
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: actions
          topics: "javascript,typescript"
          operator: OR
          format: json
          matrix-use: "false"
      - name: Assert outputs are valid
        env:
          COUNT: ${{ steps.action.outputs.count }}
          FORMAT: ${{ steps.action.outputs.format }}
          REPOS: ${{ steps.action.outputs.repos }}
        run: |
          echo "count: $COUNT"
          echo "format: $FORMAT"
          echo "repos (truncated): ${REPOS:0:300}"

          # count must be a non-negative integer
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: count is not a non-negative integer: '$COUNT'"
            exit 1
          fi

          # format must be json
          if [ "$FORMAT" != "json" ]; then
            echo "FAIL: expected format 'json', got '$FORMAT'"
            exit 1
          fi

          echo "PASS: count=$COUNT, format=$FORMAT"
