name: Test invalid operator causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          owner: actions
          operator: "INVALID"
          matrix-use: "false"
      - name: Assert action failed due to invalid operator
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid operator"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid operator 'INVALID'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
