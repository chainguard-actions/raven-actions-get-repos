name: Test AND operator with multiple topics
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: octocat
          topics: "github,git"
          operator: AND
          matrix-use: "false"
          format: json
      - name: Assert count output is a number
        env:
          COUNT: ${{ steps.action.outputs.count }}
        run: |
          echo "count: $COUNT"
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: count is not a number: $COUNT"
            exit 1
          fi
          echo "PASS: count=$COUNT"
      - name: Assert format output is json
        env:
          FORMAT: ${{ steps.action.outputs.format }}
        run: |
          echo "format: $FORMAT"
          if [ "$FORMAT" != "json" ]; then
            echo "FAIL: expected format 'json', got '$FORMAT'"
            exit 1
          fi
          echo "PASS"
