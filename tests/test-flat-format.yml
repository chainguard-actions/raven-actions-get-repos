name: Test flat format output with delimiter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          owner: actions
          format: flat
          delimiter: ","
          matrix-use: "false"
      - name: Assert flat format output
        env:
          COUNT: ${{ steps.action.outputs.count }}
          FORMAT: ${{ steps.action.outputs.format }}
          REPOS: ${{ steps.action.outputs.repos }}
        run: |
          echo "count: $COUNT"
          echo "format: $FORMAT"
          echo "repos (truncated): ${REPOS:0:300}"

          # count must be a non-negative integer
          if ! echo "$COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: count is not a non-negative integer: '$COUNT'"
            exit 1
          fi

          # format must be flat
          if [ "$FORMAT" != "flat" ]; then
            echo "FAIL: expected format 'flat', got '$FORMAT'"
            exit 1
          fi

          # repos output should be comma-separated (contains owner/repo pattern)
          # If count > 0, repos should contain at least one slash (owner/repo)
          if [ "$COUNT" -gt 0 ]; then
            if ! echo "$REPOS" | grep -q '/'; then
              echo "FAIL: flat repos output does not contain owner/repo format (no slash found)"
              exit 1
            fi
            echo "PASS: flat format repos contain owner/repo entries"
          else
            echo "PASS: count=0, no repos to validate format"
          fi

          echo "PASS: count=$COUNT, format=$FORMAT"
